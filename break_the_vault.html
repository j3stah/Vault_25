<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Break The Vault</title>
<link rel="icon" type="image/png" href="assets/site_icon.png">
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<header>
  <marquee scrollamount="10"> >>>ACCESS GRANTED TO VAULT 25.....//WELCOME TO THE BUNKER//.........//ALL SYSTEMS ONLINE//.....<<<</marquee>
</header>

<div id="header"></div>

<div class="emergency-zone">
    <button id="big-red-button">DO NOT PRESS</button>
</div>

<div id="screen-cracks" class="hidden"></div>

<script>
  fetch('main_pages_header.html')
      .then(response => response.text())
      .then(data => {
          document.getElementById('header').innerHTML = data;
      });
</script>

<script>
    const btn = document.getElementById('big-red-button');
    const cracks = document.getElementById('screen-cracks');
    const sfx = document.getElementById('break-sound');

    btn.addEventListener('click', function() {
        // 1. Play the sound immediately
        // .currentTime = 0 allows the sound to restart if they click fast
        sfx.currentTime = 0; 
        sfx.play();

        // 2. Toggle the cracks
        cracks.classList.toggle('is-broken');

        // 3. Update the UI
        if (cracks.classList.contains('is-broken')) {
            btn.innerText = "FIX SYSTEM";
            btn.style.backgroundColor = "#550000";
        } else {
            btn.innerText = "DO NOT PRESS";
            btn.style.backgroundColor = "#ff0000";
    }
});
</script>

<audio id="break-sound" src="assets/glass_break_sound.mp3" preload="auto"></audio>

</body>
</html>
