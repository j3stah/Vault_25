<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault 25 - Journal</title>
  <link rel="icon" type="image/png" href="assets/site_icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <marquee scrollamount="10"> >>>ACCESS GRANTED TO VAULT 25.....//WELCOME TO THE BUNKER//.........//ALL SYSTEMS ONLINE//.....<<<</marquee>
  </header>

  <div id="header"></div>

  <main class="content-wrapper">
    <h2>[ SHORT WRITINGS / JOURNAL ]</h2>
    <p class="centered-note">little life notes, observations, and stray thoughts</p>
    <div id="journal-list" class="journal-list"></div>
  </main>

  <script>
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    fetch('data/journal_entries.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Unable to load journal data');
        }
        return response.json();
      })
      .then(entries => {
        const container = document.getElementById('journal-list');
        if (!Array.isArray(entries) || entries.length === 0) {
          container.innerHTML = '<p class="centered-note">No entries yet. Add one to data/journal_entries.json.</p>';
          return;
        }

        container.innerHTML = entries.map(entry => {
          const title = escapeHtml(entry.title || 'Untitled');
          const date = escapeHtml(entry.date || '');
          const body = escapeHtml(entry.body || '').replace(/\n/g, '<br>');
          return `
            <article class="journal-entry">
              <div class="journal-meta">
                <h3>${title}</h3>
                <div class="journal-date">${date}</div>
              </div>
              <div class="journal-body">${body}</div>
            </article>
          `;
        }).join('');
      })
      .catch(error => {
        document.getElementById('journal-list').innerHTML = '<p class="centered-note">Unable to load journal entries right now.</p>';
        console.error(error);
      });
  </script>

  <script src="site-shell.js"></script>
</body>
</html>
